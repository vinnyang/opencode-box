name: Build and Push Docker Image
on:
  push:
    branches: [master]
    paths:
      - 'Dockerfile'
      - '.opencode-version'
      - 'docker-entrypoint.sh'
      - 'config/opencode.json'
  pull_request:
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push the built image to Docker Hub'
        required: false
        default: true
        type: boolean

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Detect image-affecting changes
        id: changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        with:
          filters: |
            image:
              - 'Dockerfile'
              - '.opencode-version'
              - 'docker-entrypoint.sh'
              - 'config/opencode.json'
      - name: Decide build/push
        id: cfg
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "build=${{ steps.changes.outputs.image }}" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "push=${{ inputs.push_image }}" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up QEMU
        if: steps.cfg.outputs.build == 'true'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - name: Set up Docker Buildx
        if: steps.cfg.outputs.build == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Login to Docker Hub
        if: steps.cfg.outputs.push == 'true'
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Generate version tag
        if: steps.cfg.outputs.build == 'true'
        id: tag
        run: |
          value="$(date -u +'%Y-%m-%d')-$(git rev-parse --short HEAD)"
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "Image tag: vinnyahh/opencode-box:$value" >> "$GITHUB_STEP_SUMMARY"
      - name: Build and Push
        if: steps.cfg.outputs.build == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.cfg.outputs.push }}
          no-cache: true
          tags: |
            vinnyahh/opencode-box:${{ steps.tag.outputs.value }}
            vinnyahh/opencode-box:latest
