name: Build and Push Docker Image
on:
  push:
    branches: [master]
    paths:
      - 'Dockerfile'
      - '.opencode-version'
      - 'docker-entrypoint.sh'
      - 'config/opencode.json'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.opencode-version'
      - 'docker-entrypoint.sh'
      - 'config/opencode.json'
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push the built image to Docker Hub'
        required: false
        default: true
        type: boolean

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Resolve push flag
        id: cfg
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "push=${{ inputs.push_image }}" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Login to Docker Hub
        if: steps.cfg.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Generate date tag
        id: date
        run: echo "tag=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.cfg.outputs.push }}
          no-cache: true
          tags: |
            vinnyahh/opencode-box:${{ steps.date.outputs.tag }}
            vinnyahh/opencode-box:latest
