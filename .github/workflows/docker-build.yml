name: Build and Push Docker Image
on:
  push:
    branches: [master]
    paths:
      - 'Dockerfile'
      - '.opencode-version'
      - 'docker-entrypoint.sh'
      - 'config/opencode.json'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.opencode-version'
      - 'docker-entrypoint.sh'
      - 'config/opencode.json'
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push the built image to Docker Hub'
        required: false
        default: true
        type: boolean

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Resolve push flag
        id: cfg
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "push=${{ inputs.push_image }}" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Login to Docker Hub
        if: steps.cfg.outputs.push == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Generate version tag
        id: tag
        run: |
          value="$(date -u +'%Y-%m-%d')-$(git rev-parse --short HEAD)"
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "Image tag: vinnyahh/opencode-box:$value" >> "$GITHUB_STEP_SUMMARY"
      - name: Build and Push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.cfg.outputs.push }}
          no-cache: true
          tags: |
            vinnyahh/opencode-box:${{ steps.tag.outputs.value }}
            vinnyahh/opencode-box:latest
